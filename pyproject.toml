[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "omnitest"
version = "0.1.0"
description = "Automation First, AI Optional — extensible test platform"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3", "sqlalchemy>=2.0,<2.1", "alembic>=1.13,<2", "httpx>=0.27,<1", "playwright>=1.48,<2", "jsonpath-ng>=1.7,<2", "regex>=2024.9"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.8,<1"]

[project.scripts]
omnitest = "omnitest.cli:main"

[project.entry-points."omnitest.adapters"]
filecheck = "omnitest.adapters.filecheck:FileAdapter"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

