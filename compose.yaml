services:
  platform:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      OMNITEST_API_TOKEN: ${OMNITEST_API_TOKEN:?Set OMNITEST_API_TOKEN in .env}
      OMNITEST_ALLOWED_HOSTS: fixture
    volumes: ["omnitest-data:/app/data"]
    shm_size: 512mb
    init: true
    depends_on:
      fixture:
        condition: service_healthy
  fixture:
    build: .
    command: ["uvicorn", "omnitest.demo_app:app", "--host", "0.0.0.0", "--port", "8765"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  omnitest-data:
