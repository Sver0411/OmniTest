name: OmniTest checks
on: [push, pull_request]
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements-dev.lock
      - run: python -m playwright install --with-deps chromium
      - run: ruff check backend scripts examples setup.py
      - run: ruff format --check backend scripts examples setup.py
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run check
      - run: npm --prefix frontend run build
      - run: pytest -q --junitxml=data/test-results.xml
      - run: python scripts/acceptance.py
      - run: python scripts/acceptance_phase2.py
      - run: python scripts/acceptance_phase4.py
      - run: python scripts/acceptance_phase5.py
      - run: python -m build --wheel
        env:
          OMNITEST_REQUIRE_UI: '1'
      - run: python scripts/verify_wheel.py dist/omnitest-0.2.0-py3-none-any.whl
      - run: docker build -t omnitest:ci .
        if: runner.os == 'Linux'
      - run: python scripts/verify_container.py
        if: runner.os == 'Linux'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results-${{ matrix.os }}
          path: |
            data/test-results.xml
            data/acceptance/
            data/phase2/
            data/phase4/
            data/phase5/
            dist/*.whl
