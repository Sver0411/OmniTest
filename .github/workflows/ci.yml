name: OmniTest checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements-dev.lock
      - run: python -m playwright install --with-deps chromium
      - run: ruff check backend scripts examples
      - run: ruff format --check backend scripts examples
      - run: pytest -q --junitxml=data/test-results.xml
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run check
      - run: npm --prefix frontend run build
      - run: python scripts/acceptance.py
      - run: python scripts/acceptance_phase2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: |
            data/test-results.xml
            data/acceptance/
            data/phase2/
